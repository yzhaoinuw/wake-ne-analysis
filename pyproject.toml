[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wake-ne-analysis"
version = "0.1.0"
description = "Per-recording and per-mouse NE fluorescence analysis during active and quiet wake"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.14", "pandas>=2.2"]

[project.optional-dependencies]
test = ["pytest>=8"]
plot = ["plotly>=5.0", "kaleido>=0.2"]
umap = ["matplotlib>=3.8", "scikit-learn>=1.4", "umap-learn>=0.5"]

[project.scripts]
wake-ne-analyze = "wake_ne_analysis.cli:analysis_main"
wake-ne-validate = "wake_ne_analysis.cli:validation_main"

[tool.setuptools.packages.find]
include = ["wake_ne_analysis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py311"]
